<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICHNOSCOPE - Motion Graphic</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0b0d13;
      color: #fff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 95vw;
      max-height: calc(95vw * 9 / 16);
      background: radial-gradient(circle at 50% 50%, #161b2b 0%, #0b0d13 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(168, 85, 247, 0.15);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 12px;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: #a855f7;
      color: #fff;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="motionCanvas" width="1280" height="720"></canvas>
  </div>
  <div class="controls">
    <button onclick="restartAnimation()">↺ Replay Animation</button>
  </div>

  <script>
    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');
    const W = 1280;
    const H = 720;

    let startTime = performance.now();
    let shards = [];
    let bgParticles = [];

    // Initialize background particles
    for (let i = 0; i < 60; i++) {
      bgParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 1,
        color: ['#a855f7', '#38bdf8', '#818cf8'][Math.floor(Math.random() * 3)],
        alpha: Math.random() * 0.4 + 0.1
      });
    }

    function createShards() {
      shards = [];
      const txt = "MANUAL TRIAGE";
      const startX = 360;
      const startY = 320;
      const cell = 26;

      for (let y = startY - 40; y <= startY + 40; y += cell) {
        for (let x = startX - 20; x <= startX + 600; x += cell) {
          const cx = x + Math.random() * (cell - 4);
          const cy = y + Math.random() * (cell - 4);
          const dx = cx - W / 2;
          const dy = cy - 320;
          const dist = Math.hypot(dx, dy) || 1;
          const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.6;
          const speed = (Math.random() * 22 + 12) * (1 + dist / 220);

          const pts = [];
          const numPts = 3 + Math.floor(Math.random() * 3);
          const baseAng = Math.random() * Math.PI * 2;
          for (let p = 0; p < numPts; p++) {
            const a = baseAng + (p / numPts) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
            const r = Math.random() * 12 + 6;
            pts.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
          }

          shards.push({
            cx, cy,
            pts,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (Math.random() * 8 + 4),
            rot: 0,
            rotSpeed: (Math.random() - 0.5) * 0.2,
            scale: Math.random() * 0.5 + 0.8
          });
        }
      }
    }

    createShards();

    function render(now) {
      const elapsed = (now - startTime) / 1000;
      ctx.clearRect(0, 0, W, H);

      // Cyber background grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let gx = 0; gx < W; gx += 64) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, H);
        ctx.stroke();
      }
      for (let gy = 0; gy < H; gy += 64) {
        ctx.beginPath();
        ctx.moveTo(0, gy);
        ctx.lineTo(W, gy);
        ctx.stroke();
      }

      // BG Particles
      bgParticles.forEach(p => {
        p.x = (p.x + p.vx + W) % W;
        p.y = (p.y + p.vy + H) % H;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // 1. MANUAL TRIAGE (0s to 1.3s)
      if (elapsed < 1.3) {
        let alpha = Math.min(1.0, elapsed / 0.4);
        let jx = 0, jy = 0;
        if (elapsed > 0.9) {
          const shake = (elapsed - 0.9) * 12;
          jx = (Math.random() - 0.5) * shake;
          jy = (Math.random() - 0.5) * shake;
        }

        ctx.save();
        ctx.translate(jx, jy);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Red Glow
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 25;
        ctx.font = 'bold 78px Bahnschrift, "Segoe UI", sans-serif';
        ctx.fillStyle = `rgba(239, 68, 68, ${alpha})`;
        ctx.fillText('MANUAL TRIAGE', W / 2, 320);

        // Subtitle
        ctx.shadowBlur = 0;
        ctx.font = '500 20px Consolas, monospace';
        ctx.fillStyle = `rgba(248, 113, 113, ${alpha * 0.8})`;
        ctx.fillText('[ SLOW • FRAGMENTED • INCIDENT FATIGUE ]', W / 2, 385);
        ctx.restore();
      }

      // 2. SHATTER (1.3s to 2.5s)
      if (elapsed >= 1.3 && elapsed < 2.5) {
        const dt = elapsed - 1.3;
        const fade = Math.max(0, 1 - dt / 1.1);

        // Shockwave
        const shockR = dt * 800;
        ctx.beginPath();
        ctx.arc(W / 2, 320, shockR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(168, 85, 247, ${fade * 0.8})`;
        ctx.lineWidth = 3 * fade;
        ctx.stroke();

        // Shards
        const gravity = 650;
        shards.forEach(s => {
          const sx = s.cx + s.vx * dt;
          const sy = s.cy + s.vy * dt + 0.5 * gravity * dt * dt;
          s.rot += s.rotSpeed;

          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(s.rot);
          ctx.scale(s.scale, s.scale);

          ctx.beginPath();
          s.pts.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.closePath();

          ctx.fillStyle = `rgba(239, 68, 68, ${fade})`;
          ctx.fill();
          ctx.strokeStyle = `rgba(254, 202, 202, ${fade * 0.9})`;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.restore();
        });
      }

      // 3. ICHNOSCOPE: Event-Driven Agent Orchestration (2.0s onwards)
      if (elapsed >= 2.0) {
        const it = elapsed - 2.0;
        const fadeIn = Math.min(1.0, it / 0.8);
        const scale = Math.min(1.0, 0.85 + (it / 0.8) * 0.15);

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Radiant glow
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 35 * fadeIn;

        // Gradient Title
        const grad = ctx.createLinearGradient(W/2 - 300, 0, W/2 + 300, 0);
        grad.addColorStop(0, '#38bdf8');
        grad.addColorStop(0.5, '#ffffff');
        grad.addColorStop(1, '#a855f7');

        ctx.font = 'bold 88px Bahnschrift, "Segoe UI", sans-serif';
        ctx.fillStyle = grad;
        ctx.fillText('ICHNOSCOPE', W / 2, 290);

        // Divider laser bar
        if (it > 0.4) {
          const bt = Math.min(1.0, (it - 0.4) / 0.6);
          const barW = 680 * bt;
          ctx.shadowColor = '#a855f7';
          ctx.shadowBlur = 15;
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect((W - barW) / 2, 350, barW, 2.5);
        }

        // Subtitle: Event-Driven Agent Orchestration
        if (it > 0.7) {
          const st = Math.min(1.0, (it - 0.7) / 0.6);
          const sy = 395 + (1 - st) * 15;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.font = '600 32px "Segoe UI", sans-serif';
          ctx.fillStyle = `rgba(224, 242, 254, ${st})`;
          ctx.fillText('Event-Driven Agent Orchestration', W / 2, sy);
        }

        // Pill badge
        if (it > 1.1) {
          const pt = Math.min(1.0, (it - 1.1) / 0.5);
          ctx.shadowBlur = 0;
          ctx.font = '600 13px Consolas, monospace';
          ctx.fillStyle = `rgba(148, 163, 184, ${pt})`;
          ctx.fillText('DETERMINISTIC CODE BLAME  •  BOUNDED LLM EXPLANATION  •  HUMAN SIGN-OFF', W / 2, 630);
        }

        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    function restartAnimation() {
      createShards();
      startTime = performance.now();
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
